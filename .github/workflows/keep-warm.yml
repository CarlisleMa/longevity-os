# Pings the backend's /health every ~10 minutes so Render's free tier never spins
# down (it sleeps after ~15 min idle, causing a 30–60s cold start on the next visit).
#
# Setup: Repo → Settings → Secrets and variables → Actions → Variables → New variable
#   Name: BACKEND_URL   Value: https://<your-service>.onrender.com   (no trailing slash)
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="${{ vars.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_URL repo variable not set — skipping."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi
          echo "Pinging $URL/health"
          for i in 1 2 3 4; do
            if curl -fsS --max-time 90 "$URL/health"; then echo " — ok"; exit 0; fi
            echo "attempt $i failed (cold start?), retrying in 20s…"; sleep 20
          done
          echo "Could not reach $URL/health after retries."; exit 1
